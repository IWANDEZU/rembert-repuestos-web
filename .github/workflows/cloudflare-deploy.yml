name: Validar y desplegar REMBERT en Cloudflare

on:
  push:
    branches: [cloudflare-migration]
  workflow_dispatch:

concurrency:
  group: rembert-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias reproducibles
        run: npm ci

      - name: Validar catálogo, imágenes y código
        run: npm run verify:release

      - name: Construir Worker
        run: npm run build:cloudflare
        env:
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgresql://local:local@127.0.0.1:5432/local
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_POSTGRES_URL: ${{ secrets.DATABASE_POSTGRES_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Sincronizar catálogo transaccional
        run: npm run sync:inventory -- --apply
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Desplegar compilación validada
        run: npm run deploy:cloudflare:built
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
