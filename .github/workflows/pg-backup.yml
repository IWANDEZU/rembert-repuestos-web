name: Periodic Database Backup

on:
  schedule:
    # Corre todos los días a las 3:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Permite ejecutarlo manualmente desde el panel de GitHub

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
    - name: Set up PostgreSQL client
      run: sudo apt-get update && sudo apt-get install -y postgresql-client

    - name: Generate timestamp
      id: date
      run: echo "timestamp=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_ENV

    - name: Run pg_dump
      env:
        # Se requiere configurar este secreto en el repositorio de GitHub
        DATABASE_POSTGRES_URL: ${{ secrets.DATABASE_POSTGRES_URL }}
      run: |
        if [ -z "$DATABASE_POSTGRES_URL" ]; then
          echo "Error: La variable DATABASE_POSTGRES_URL no esta configurada en GitHub Secrets."
          exit 1
        fi
        
        echo "Iniciando respaldo de base de datos..."
        pg_dump "$DATABASE_POSTGRES_URL" -F p -f "backup_victorservices_${{ env.timestamp }}.sql"
        echo "Respaldo completado."

    - name: Upload Backup Artifact
      uses: actions/upload-artifact@v4
      with:
        name: db-backup-${{ env.timestamp }}
        path: backup_victorservices_${{ env.timestamp }}.sql
        retention-days: 90 # Guarda los respaldos por 90 días en GitHub
